[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foxyface"
version = "1.0.5.1"
description = "Real-time face tracking application for VRChat using MediaPipe and Project Babble"
readme = "README.md"
authors = [
    { name = "Jeka8833", email = "foxyface@jeka8833.pp.ua" },
]
maintainers = [
    { name = "Jeka8833", email = "foxyface@jeka8833.pp.ua" },
]
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Capture",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Games/Entertainment",
]
keywords = [
    "foxyface",
    "vrchat",
    "vrcft",
    "face-tracking",
    "mediapipe",
    "babble",
    "pyside6",
    "facial-tracking",
    "osc",
    "vtuber",
]
dependencies = [
    "mediapipe",
    "PySide6",
    "opencv-contrib-python",
    "dataclass-wizard",
    "OneEuroFilter",
    "packaging",
    "scipy",
    "numpy",
    "soundfile",
    "sounddevice",
    "requests",
    "cv2-enumerate-cameras",
    "onnxruntime-directml; platform_system == 'Windows'",
    "onnxruntime-coreml; platform_system == 'Darwin'",
]

[project.optional-dependencies]
nvidia = [
    "onnxruntime-gpu",
    "torch",
    "torchvision",
]
rocm = [
    "onnxruntime-rocm",
]
openvino = [
    "onnxruntime-openvino",
]
cpu = [
    "onnxruntime",
]

[project.scripts]
foxyface = "foxyface.Setup:main"

[project.urls]
Homepage = "https://foxyface.jeka8833.pp.ua"
Documentation = "https://foxyface.jeka8833.pp.ua/docs/FirstSetup/"
Repository = "https://github.com/Jeka8833/FoxyFace"
Issues = "https://github.com/Jeka8833/FoxyFace/issues"
Changelog = "https://github.com/Jeka8833/FoxyFace/releases"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"foxyface" = "src/foxyface"
"foxyface.assets" = "src/foxyface/assets"
"foxyface.assets.baballonia" = "Baballonia/src/Baballonia"

[tool.setuptools.package-data]
"foxyface.assets" = ["*"]
"foxyface.assets.baballonia" = ["*.onnx"]
